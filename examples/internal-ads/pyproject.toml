[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "riality-internal-ads"
version = "0.1.0"
description = "Self-hosted paid media operations over MCP and HTTP"
requires-python = ">=3.12"
dependencies = ["fastapi==0.162.2", "uvicorn==0.54.0", "mcp==1.30.0", "httpx[socks]==0.28.1", "cryptography==50.0.2", "python-dotenv==1.2.4"]

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1"]

[project.scripts]
riality-ads = "internal_ads.server:main"

[tool.setuptools.packages.find]
include = ["internal_ads*"]

[tool.setuptools.package-data]
internal_ads = ["operator.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
